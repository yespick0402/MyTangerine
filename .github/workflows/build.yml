name: Build 00Favorite App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check uploaded app sources
        shell: bash
        run: |
          set -euo pipefail
          test -s Part1.swift || { echo 'ERROR: Part1.swift 없음'; exit 1; }
          test -s Part2.swift || { echo 'ERROR: Part2.swift 없음'; exit 1; }
          test -s icon.png || { echo 'ERROR: icon.png 없음'; exit 1; }
          test -s icon_awake.png || { echo 'ERROR: icon_awake.png 없음'; exit 1; }
          cat Part1.swift Part2.swift > combined_main.swift
          # Swift 구문 검사로는 SDK 이름 변경 오류를 검출할 수 없으므로 구형 상수를 차단합니다.
          if grep -nF 'kCFRunLoopCommonModes' combined_main.swift; then
            echo 'ERROR: 구형 CoreFoundation 상수. CFRunLoopMode.commonModes를 사용하세요.' >&2
            exit 1
          fi
          grep -q 'struct ImageJoinView: View' combined_main.swift || { echo 'ERROR: 이미지 합치기 소스 누락'; exit 1; }
          grep -q 'final class FavoriteAwakeManager' combined_main.swift || { echo 'ERROR: 독립 잠자기 방지 기능 소스 누락'; exit 1; }
          grep -q 'import IOKit.pwr_mgt' combined_main.swift || { echo 'ERROR: IOKit 전원관리 연동 누락'; exit 1; }
          grep -q 'final class FavoriteAwakeHotKey' combined_main.swift || { echo 'ERROR: 잠자기 토글 단축키 코드 누락'; exit 1; }
          grep -q 'tap: .cgSessionEventTap' combined_main.swift || { echo 'ERROR: 앱 전환 후 동작하는 세션 전역 단축키 감시 누락'; exit 1; }
          grep -q 'private func handleGlobalKeyDown' combined_main.swift || { echo 'ERROR: 전역 잠자기 토글 처리 누락'; exit 1; }
          grep -q 'options: .defaultTap' combined_main.swift || { echo 'ERROR: 선택 단축키 입력 중복 방지 코드 누락'; exit 1; }
          grep -q 'func reconnectForSuppression() -> Bool' combined_main.swift || { echo 'ERROR: 읽기 전용에서 입력 차단 승격 코드 누락'; exit 1; }
          if grep -Fq 'NSEvent.addGlobalMonitorForEvents(matching: [.keyDown])' combined_main.swift; then echo 'ERROR: 구형 전역 AppKit 키 감시 재도입 금지'; exit 1; fi
          if grep -q 'RegisterEventHotKey(' combined_main.swift; then echo 'ERROR: 위험한 전역 핫키 선점 방식 재도입 금지'; exit 1; fi
          grep -q 'canObserveActionRelease' combined_main.swift || { echo 'ERROR: Control 액션 드롭 보완 소스 누락'; exit 1; }

      - name: Preflight - macOS SDK Swift typecheck
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Xcode / Swift / macOS SDK ==='
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk macosx --show-sdk-path
          echo '=== Full source macOS SDK typecheck ==='
          # 실제 앱 컴파일과 동일한 대상과 프레임워크로 통합 소스를 타입 검사합니다.
          swiftc -typecheck combined_main.swift \
            -framework IOKit -framework Carbon \
            -target arm64-apple-macos14.0
          echo 'macOS SDK Swift typecheck: PASSED'

      - name: Create App Bundle and Icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 00Favorite.app/Contents/{MacOS,Resources}
          cat <<'EOF' > 00Favorite.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>00Favorite</string>
            <key>CFBundleIdentifier</key><string>win.yespick.00favorite</string>
            <key>CFBundleName</key><string>00Favorite</string>
            <key>CFBundleDisplayName</key><string>00Favorite</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>4.8</string>
            <key>CFBundleVersion</key><string>4814</string>
            <key>FavoriteBuildID</key><string>FAV-20261121-HK12R1</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>LSArchitecturePriority</key><array><string>arm64</string></array>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSDesktopFolderUsageDescription</key><string>사용자가 선택한 바탕화면 파일을 변환하고 결과 파일을 원본 폴더에 저장하기 위해 필요합니다.</string>
            <key>NSDocumentsFolderUsageDescription</key><string>사용자가 선택한 문서 파일을 읽고 변환 결과를 저장하기 위해 필요합니다.</string>
            <key>NSDownloadsFolderUsageDescription</key><string>사용자가 선택한 다운로드 파일을 변환하고 결과 파일을 저장하기 위해 필요합니다.</string>
            <key>NSRemovableVolumesUsageDescription</key><string>사용자가 선택한 외장 저장장치의 파일을 처리하기 위해 필요합니다.</string>
            <key>NSNetworkVolumesUsageDescription</key><string>사용자가 선택한 네트워크 폴더의 파일을 처리하기 위해 필요합니다.</string>
          </dict>
          </plist>
          EOF
          plutil -lint 00Favorite.app/Contents/Info.plist
          cp icon.png 00Favorite.app/Contents/Resources/icon.png
          cp icon_awake.png 00Favorite.app/Contents/Resources/icon_awake.png
          mkdir -p AppIcon.iconset
          sips -z 16 16 -s format png icon.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32 -s format png icon.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32 -s format png icon.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64 -s format png icon.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128 -s format png icon.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256 -s format png icon.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256 -s format png icon.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512 -s format png icon.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512 -s format png icon.png --out AppIcon.iconset/icon_512x512.png
          sips -z 1024 1024 -s format png icon.png --out AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o 00Favorite.app/Contents/Resources/AppIcon.icns

      - name: Bundle verified Apple Silicon FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          FF_BIN='00Favorite.app/Contents/Resources/ffmpeg'
          fetch_ffmpeg() {
            local url="$1"
            local entry=''
            echo "FFmpeg download: ${url}"
            rm -f ffmpeg.zip "$FF_BIN"
            curl -fL --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 180 "$url" -o ffmpeg.zip || return 1
            unzip -tqq ffmpeg.zip || return 1
            entry="$(unzip -Z1 ffmpeg.zip | grep -E '(^|/)ffmpeg$' | head -n 1)" || return 1
            [ -n "$entry" ] || return 1
            unzip -p ffmpeg.zip "$entry" > "$FF_BIN" || return 1
            chmod +x "$FF_BIN"
            lipo -archs "$FF_BIN" | grep -qw 'arm64' || return 1
            xattr -cr "$FF_BIN"
            codesign --force --sign - "$FF_BIN" || return 1
            "$FF_BIN" -version >/dev/null 2>&1 || return 1
            return 0
          }
          if fetch_ffmpeg 'https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip'; then
            echo 'FFmpeg Apple Silicon release verified.'
          elif fetch_ffmpeg 'https://www.osxexperts.net/ffmpeg7arm.zip'; then
            echo 'FFmpeg alternate Apple Silicon release verified.'
          else
            echo 'ERROR: FFmpeg 다운로드·압축해제·ARM64 실행 검사 실패. 불완전한 앱을 배포하지 않습니다.' >&2
            exit 1
          fi
          "$FF_BIN" -version | head -n 1

      - name: Compile and verify native macOS app
        shell: bash
        run: |
          set -euo pipefail
          swiftc combined_main.swift \
            -framework IOKit -framework Carbon \
            -o 00Favorite.app/Contents/MacOS/00Favorite \
            -target arm64-apple-macos14.0 -Osize
          strip -x 00Favorite.app/Contents/MacOS/00Favorite
          lipo -archs 00Favorite.app/Contents/MacOS/00Favorite | grep -qw 'arm64'
          xattr -cr 00Favorite.app
          # 서명이 끝난 다음 앱 리소스를 다시 수정하지 않습니다.
          # 이름·실행 파일·식별자는 앱 내부와 코드 서명에서 반드시 같아야 합니다.
          # 기존 MyTangerine 서명·ID가 들어 있는 산출물은 배포하지 않습니다.
          APP="00Favorite.app"
          ID="win.yespick.00favorite"
          INFO="$APP/Contents/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")" = "$ID" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$INFO")" = '00Favorite' ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO")" = '00Favorite' ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")" = '00Favorite' ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :FavoriteBuildID' "$INFO")" = 'FAV-20261121-HK12R1' ]
          test -x "$APP/Contents/MacOS/00Favorite"
          # FFmpeg는 앞 단계에서 별도 서명됐으므로 main app만 별도 서명합니다.
          # --deep으로 내부 실행 도구에 동일 앱 식별자가 부여되는 일을 방지합니다.
          # Ad-hoc 서명이므로 업데이트마다 TCC 권한 재승인이 필요할 수 있습니다.
          codesign --force --sign - --identifier "$ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          SIGN_INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          printf '%s\n' "$SIGN_INFO" | grep -Fx 'Identifier=win.yespick.00favorite'
          printf '%s\n' "$SIGN_INFO" | grep -q '^Signature=adhoc$'
          echo '00Favorite bundle identity: VERIFIED'
          echo '00Favorite display name: VERIFIED'
          echo '00Favorite signing identifier: VERIFIED'
          ditto -c -k --sequesterRsrc --keepParent "$APP" 00Favorite.zip
          unzip -tqq 00Favorite.zip
          # 완성된 압축에도 실제 새 Info.plist가 들어있는지 검사합니다.
          unzip -p 00Favorite.zip '00Favorite.app/Contents/Info.plist' > packaged-Info.plist
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' packaged-Info.plist)" = "$ID" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' packaged-Info.plist)" = '00Favorite' ]

      - name: Upload Finished Mac App
        uses: actions/upload-artifact@v4
        with:
          name: 00Favorite-4.8-FAV-20261121-HK12R1-Mac-ARM64
          path: 00Favorite.zip
          if-no-files-found: error
