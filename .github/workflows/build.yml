name: Build MyTangerine App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create App Bundle, Pure Transparent Icon & Bundle ARM64 FFmpeg
        run: |
          mkdir -p MyTangerine.app/Contents/MacOS
          mkdir -p MyTangerine.app/Contents/Resources

          # 1. Info.plist를 먼저 정확하게 생성 (XML 문법 오류 완벽 수정)
          cat << 'EOF' > MyTangerine.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MyTangerine</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.mytangerine</string>
              <key>CFBundleName</key>
              <string>MyTangerine</string>
              <key>CFBundleDisplayName</key>
              <string>MyTangerine</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>4.2</string>
              <key>CFBundleVersion</key>
              <string>4.2</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>LSArchitecturePriority</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 2. 업로드된 icon.png로 투명 알파 채널이 살아있는 AppIcon.icns 생성
          if [ -f icon.png ]; then
            cp icon.png MyTangerine.app/Contents/Resources/icon.png
            mkdir -p AppIcon.iconset
            sips -z 16 16     -s format png icon.png --out AppIcon.iconset/icon_16x16.png
            sips -z 32 32     -s format png icon.png --out AppIcon.iconset/icon_16x16@2x.png
            sips -z 32 32     -s format png icon.png --out AppIcon.iconset/icon_32x32.png
            sips -z 64 64     -s format png icon.png --out AppIcon.iconset/icon_32x32@2x.png
            sips -z 128 128   -s format png icon.png --out AppIcon.iconset/icon_128x128.png
            sips -z 256 256   -s format png icon.png --out AppIcon.iconset/icon_128x128@2x.png
            sips -z 256 256   -s format png icon.png --out AppIcon.iconset/icon_256x256.png
            sips -z 512 512   -s format png icon.png --out AppIcon.iconset/icon_256x256@2x.png
            sips -z 512 512   -s format png icon.png --out AppIcon.iconset/icon_512x512.png
            sips -z 1024 1024 -s format png icon.png --out AppIcon.iconset/icon_512x512@2x.png
            iconutil -c icns AppIcon.iconset -o MyTangerine.app/Contents/Resources/AppIcon.icns || true
          fi

          # 3. 독립 실행형 ARM64 FFmpeg 내장 및 실행 권한/서명 정리
          curl -L -s "https://www.osxexperts.net/ffmpeg7arm.zip" -o ffmpeg.zip || true
          unzip -q -o ffmpeg.zip -d MyTangerine.app/Contents/Resources/ || true

          if [ ! -f MyTangerine.app/Contents/Resources/ffmpeg ]; then
            curl -L -s "https://evermeet.cx/ffmpeg/getrelease/zip" -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0)" -o ffmpeg.zip || true
            unzip -q -o ffmpeg.zip -d MyTangerine.app/Contents/Resources/ || true
          fi

          if [ -f MyTangerine.app/Contents/Resources/ffmpeg ]; then
            chmod +x MyTangerine.app/Contents/Resources/ffmpeg
            xattr -cr MyTangerine.app/Contents/Resources/ffmpeg || true
            codesign --force --sign - MyTangerine.app/Contents/Resources/ffmpeg || true
          fi

      - name: Combine Parts, Compile & Sign Pure Native App
        run: |
          if [ -f Part1.swift ] && [ -f Part2.swift ]; then
            cat Part1.swift Part2.swift > combined_main.swift
          else
            cp main.swift combined_main.swift
          fi
          swiftc combined_main.swift -o MyTangerine.app/Contents/MacOS/MyTangerine -target arm64-apple-macos14.0 -Osize
          strip -x MyTangerine.app/Contents/MacOS/MyTangerine

          # Info.plist 문법 검증 (오류 시 즉시 감지)
          plutil -lint MyTangerine.app/Contents/Info.plist

          # 불필요한 확장 속성 제거 후 내부 바이너리부터 전체 앱 번들까지 순서대로 깔끔하게 서명
          xattr -cr MyTangerine.app
          codesign --force --deep --sign - MyTangerine.app

          # macOS가 회색 네모 박스(Squircle)를 씌우지 못하도록 투명 PNG를 Finder 커스텀 아이콘으로 각인
          if [ -f icon.png ]; then
            swift -e '
            import Cocoa
            if let img = NSImage(contentsOfFile: "icon.png") {
                NSWorkspace.shared.setIcon(img, forFile: "MyTangerine.app", options: [])
            }
            ' || true
          fi

          # 커스텀 투명 아이콘 리소스 포크(--sequesterRsrc)를 보존하여 압축
          ditto -c -k --sequesterRsrc --keepParent MyTangerine.app MyTangerine.zip

      - name: Upload Finished Mac App
        uses: actions/upload-artifact@v4
        with:
          name: MyTangerine-Mac-App
          path: MyTangerine.zip
