name: Build MyTangerine App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create App Bundle, Pure Transparent Icon & Bundle ARM64 FFmpeg
        run: |
          mkdir -p MyTangerine.app/Contents/MacOS
          mkdir -p MyTangerine.app/Contents/Resources

          # icon.png의 투명도(Alpha)를 100% 유지하고 macOS가 회색 박스를 씌우지 않도록 여백을 맞춰 icns 생성
          if [ -f icon.png ]; then
            cp icon.png MyTangerine.app/Contents/Resources/icon.png
            mkdir -p AppIcon.iconset
            swift -e '
            import Cocoa
            guard let src = NSImage(contentsOfFile: "icon.png") else { exit(1) }
            let sizes: [(String, Int)] = [
                ("icon_16x16.png", 16), ("icon_16x16@2x.png", 32),
                ("icon_32x32.png", 32), ("icon_32x32@2x.png", 64),
                ("icon_128x128.png", 128), ("icon_128x128@2x.png", 256),
                ("icon_256x256.png", 256), ("icon_256x256@2x.png", 512),
                ("icon_512x512.png", 512), ("icon_512x512@2x.png", 1024)
            ]
            for (name, px) in sizes {
                let rep = NSBitmapImageRep(
                    bitmapDataPlanes: nil, pixelsWide: px, pixelsHigh: px,
                    bitsPerSample: 8, samplesPerPixel: 4, hasAlpha: true, isPlanar: false,
                    colorSpaceName: .deviceRGB, bytesPerRow: 0, bitsPerPixel: 0
                )!
                NSGraphicsContext.saveGraphicsState()
                NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)
                NSColor.clear.set()
                NSRect(x: 0, y: 0, width: px, height: px).fill()
                let pad = CGFloat(px) * 0.09
                let drawRect = NSRect(x: pad, y: pad, width: CGFloat(px) - pad * 2, height: CGFloat(px) - pad * 2)
                src.draw(in: drawRect, from: .zero, operation: .sourceOver, fraction: 1.0)
                NSGraphicsContext.restoreGraphicsState()
                if let data = rep.representation(using: .png, properties: [:]) {
                    try? data.write(to: URL(fileURLWithPath: "AppIcon.iconset/\(name)"))
                }
            }
            '
            iconutil -c icns AppIcon.iconset -o MyTangerine.app/Contents/Resources/AppIcon.icns || true
          fi

          # 독립 실행형 ARM64 FFmpeg 내장
          curl -L -s "https://www.osxexperts.net/ffmpeg7arm.zip" -o ffmpeg.zip || true
          unzip -q -o ffmpeg.zip -d MyTangerine.app/Contents/Resources/ || true

          if [ ! -f MyTangerine.app/Contents/Resources/ffmpeg ]; then
            curl -L -s "https://evermeet.cx/ffmpeg/getrelease/zip" -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0)" -o ffmpeg.zip || true
            unzip -q -o ffmpeg.zip -d MyTangerine.app/Contents/Resources/ || true
          fi

          if [ -f MyTangerine.app/Contents/Resources/ffmpeg ]; then
            chmod +x MyTangerine.app/Contents/Resources/ffmpeg
          fi

          cat << 'EOF' > MyTangerine.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MyTangerine</string>
              <key>CFBundleIdentifier</key>
              <string>com.custom.mytangerine</string>
              <key>CFBundleName</string>
              <string>MyTangerine</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>4.1</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>LSArchitecturePriority</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Combine Parts & Compile Pure Native Apple Silicon (arm64) App
        run: |
          if [ -f Part1.swift ] && [ -f Part2.swift ]; then
            cat Part1.swift Part2.swift > combined_main.swift
          else
            cp main.swift combined_main.swift
          fi
          swiftc combined_main.swift -o MyTangerine.app/Contents/MacOS/MyTangerine -target arm64-apple-macos14.0 -Osize
          strip -x MyTangerine.app/Contents/MacOS/MyTangerine
          codesign --force --deep --sign - MyTangerine.app
          zip -r -y MyTangerine.zip MyTangerine.app

      - name: Upload Finished Mac App
        uses: actions/upload-artifact@v4
        with:
          name: MyTangerine-Mac-App
          path: MyTangerine.zip
